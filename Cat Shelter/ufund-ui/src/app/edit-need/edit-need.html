<div class="page-container">
  <div class="main-menu">
    <h2>Edit Need</h2>

    <div class="input-group">
      <label>Name:</label>
      <input type="text" placeholder="Enter name" [(ngModel)]="name">
    </div>

    <div class="input-group">
      <label>Quantity:</label>
      <input type="number" placeholder="Enter quantity" [(ngModel)]="quantity">
    </div>

    <div class="input-group">
      <label>Type:</label>
      <input type="text" placeholder="Enter type" [(ngModel)]="type">
    </div>

    <div class="input-group">
      <label>Cost:</label>
      <input type="number" placeholder="Enter cost" [(ngModel)]="cost">
    </div>

    <div class="button-group">
      <button class="button-background" (click)="saveNeed()">Save</button>
      <button class="button-background" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>
