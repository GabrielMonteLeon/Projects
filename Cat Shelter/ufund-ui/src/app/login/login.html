<div class="page-container">
  <div class="main-menu">
    <div class="input-group">
      <label>Username:</label>
      <input type="text" placeholder="Enter username" [(ngModel)]="username">
    </div>
    <div class="input-group">
      <label>Password:</label>
      <input type="password" placeholder="Enter password" [(ngModel)]="password">
    </div>
    <div class="button-group">
      <button class="button-background" id="create_account" (click)="createAccount()">Create Account</button>
    </div>
    <div class="button-group">
      <button class="button-background" (click)="login()">Login</button>
    </div>
  </div>
</div>
