<div class="create-need-container">
  <div class="main-menu">
  <h2>New Need</h2>

  <form #needForm="ngForm" class="need-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" [(ngModel)]="newNeed.name" required>
    </div>

    <div class="form-group">
      <label for="type">Type</label>
      <input type="text" id="type" name="type" [(ngModel)]="newNeed.type" required>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" [(ngModel)]="newNeed.quantity" required>
    </div>

    <div class="form-group">
      <label for="cost">Cost</label>
      <input type="number" id="cost" name="cost" [(ngModel)]="newNeed.cost" required>
    </div>

    <div class="button-row">
      <button type="button" class="btn-create" (click)="onCreate()">Create</button>
      <button type="button" class="btn-back" (click)="onBack()">Back</button>
    </div>
  </form>
</div>
</div>
